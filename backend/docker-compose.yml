services:
  postgres:
    image: postgres:16-alpine
    container_name: vacciner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacciner
      POSTGRES_PASSWORD: vacciner_dev_password
      POSTGRES_DB: vacciner_log
    ports:
      - "5433:5432"
    volumes:
      - vacciner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacciner -d vacciner_log"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vacciner_pgdata:
